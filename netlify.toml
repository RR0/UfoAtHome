# What ufoathome.org builds, and where from.
#
# The site is built LOCALLY and uploaded by `npm run deploy:site` (build:site, then
# `netlify deploy --prod --dir dist-site --no-build`): building on every push to master used up
# Netlify's monthly build minutes. Git builds are stopped in the Netlify project settings, so a push
# no longer deploys anything. This file still states the build for the CLI (`netlify build`,
# `netlify deploy` without --no-build) and for the day git builds would be turned back on: the
# project's own settings point at `npm run build` / `dist`, the local ENGINE DEMO, not the site.
#
# Redirects and headers are deliberately NOT here: site/build.ts writes `_redirects` and `_headers`
# into dist-site/ itself, and Netlify reads those from the deployed directory. They are generated
# (one language-detection rule per page), so a hand-maintained copy here would be a second source
# of truth that drifts the first time a page is added.

[build]
  command = "npm run build:site"
  publish = "dist-site"

[build.environment]
  # package.json asks for >= 20; pinned so a change of Netlify's own default cannot quietly move it.
  NODE_VERSION = "22"
