# Installs, tests and builds on the three platforms a contributor may clone onto, so that "it
# works on my machine" is checked for Windows and Linux as well as for the Mac it is written on.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # package.json's floor, and what Netlify builds the site with (netlify.toml).
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      # Shared runners are two to three times slower than the machine the CPU-time budgets were set
      # on (test/engine/astronomy/SkyGlowVisibility.test.ts measured 46 to 97 ms against 40). Four on Windows: see the test step.
      PERF_BUDGET_SCALE: 3
      # macOS runners have 7 GB, which gives Node a heap of about 2 GB, and one jsdom test worker
      # outgrew it there (heap out of memory on both Node versions) while Linux and Windows passed.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The editor's jsdom suite runs single tests of several seconds on these runners (macOS timed
      # out at vitest's default 5 s) where the development machine takes a fraction of that.
      # On Windows, a worker per core left the main process too busy to answer the workers' progress
      # reports: every test passed and the run still failed on vitest's "Timeout calling
      # onTaskUpdate" (Node 22, 2026-09-25 and 26). Two workers leave it room.
      # The same on every platform since 2026-10-18: the suite grew, and a worker per core left the main process too busy to answer the workers'
      # requests for modules ("Timeout calling fetch", on a different job each run: Windows, then macOS, with every test passing). Vitest then
      # fails the run on those unhandled errors.
      # Threads on Windows since 2026-10-24: there, Node 22 timed out a progress report on four runs running (every test passing), with two
      # forked workers and then with one, so the main process was not too busy: the forks' reports go through the pipes between processes,
      # where threads pass them in memory.
      # The CPU-time budgets a quarter larger there, where the workers are threads of one process (128 ms measured against 120). Set here, not
      # with the job's other variables: the runner's own context is not known yet there.
      - run: npm test -- --testTimeout=30000 --maxWorkers=2 ${{ runner.os == 'Windows' && '--pool=threads' || '' }}
        env:
          PERF_BUDGET_SCALE: ${{ runner.os == 'Windows' && '4' || '3' }}
      - run: npm run build
      - run: npm run build:site
