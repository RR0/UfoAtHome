# Installs, tests and builds on the three platforms a contributor may clone onto, so that "it
# works on my machine" is checked for Windows and Linux as well as for the Mac it is written on.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # package.json's floor, and what Netlify builds the site with (netlify.toml).
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      # Shared runners are two to three times slower than the machine the CPU-time budgets were set
      # on (test/engine/astronomy/SkyGlowVisibility.test.ts measured 46 to 97 ms against 40).
      PERF_BUDGET_SCALE: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:site
